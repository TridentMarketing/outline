# TRA Summit deploy — mirrors tra-summit's deploy-staging.yml convention:
# GitHub Actions drives, Railway obeys (auto-deploy stays OFF). `railway up`
# uploads this checkout and Railway builds it with Dockerfile.summit.
#
# Auth: the org-level RAILWAY_ORG_TOKEN secret (a Railway account/team token,
# so the CLI reads it from RAILWAY_API_TOKEN), the same way every other TRA
# repo's railway-deploy.yml does. This repo must be in that secret's selected
# repositories (GitHub org settings → Secrets → RAILWAY_ORG_TOKEN).
name: Deploy to Summit

on:
  push:
    branches:
      - tra
  workflow_dispatch:
    inputs:
      environment:
        description: Railway environment to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: railway-outline-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: ${{ inputs.environment || 'staging' }}
      RAILWAY_PROJECT_ID: 6e000682-0600-46fb-8f4e-559b4dbcb1d6
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy outline (${{ env.ENVIRONMENT }})
        run: railway up --service outline --environment "$ENVIRONMENT" --ci
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_ORG_TOKEN }}
