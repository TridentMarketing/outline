# TRA Summit deploy — mirrors tra-summit's deploy-staging.yml convention:
# GitHub Actions drives, Railway obeys (auto-deploy stays OFF). `railway up`
# uploads this checkout and Railway builds it with Dockerfile.summit.
#
# Secrets/vars on this repo:
#   RAILWAY_API_TOKEN          Railway account token (CLI reads account tokens
#                              from RAILWAY_API_TOKEN, project tokens from RAILWAY_TOKEN)
#   RAILWAY_SUMMIT_PROJECT_ID  6e000682-0600-46fb-8f4e-559b4dbcb1d6 (repo variable)
name: Deploy to Summit

on:
  push:
    branches:
      - tra
  workflow_dispatch:
    inputs:
      environment:
        description: Railway environment to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: railway-outline-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENVIRONMENT: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy outline (${{ env.ENVIRONMENT }})
        run: railway up --service outline --environment "$ENVIRONMENT" --ci
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_SUMMIT_PROJECT_ID }}
